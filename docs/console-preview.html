<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>blah — console example</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          ui-monospace,
          'SF Mono',
          Menlo,
          Monaco,
          Consolas,
          monospace;
        font-size: 13px;
        line-height: 1.45;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #333;
        color: #9aa0a6;
        font-size: 12px;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .badge {
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 700;
      }
      .ns {
        background: orange;
        color: white;
      }
      .a1 {
        background: blue;
        color: white;
      }
      .a2 {
        background: yellow;
        color: white;
      }
      .warn-badge {
        background: #b45309;
        color: white;
      }
      .text {
        color: #d4d4d4;
      }
      .muted {
        color: #6b7280;
        margin-top: 10px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">Console — example output from blah</div>
    <div class="line">
      <span class="badge ns">Blah</span>
      <span class="badge a1">Clicked</span>
      <span class="badge a2">worked awesome</span>
      <span class="badge a2">another one</span>
    </div>
    <div class="line">
      <span class="badge ns">Blah</span>
      <span class="text">dev mode: debug overrides logging (warn is on)</span>
    </div>
    <div class="line">
      <span class="badge ns">App</span>
      <span class="badge a1">user clicked</span>
      <span class="badge a2">button#submit</span>
    </div>
    <div class="line">
      <span class="badge ns">App</span>
      <span class="badge warn-badge">slow request</span>
      <span class="text">{"ms":420}</span>
    </div>
    <p class="muted">Styled with console %c — open DevTools to see live output.</p>
  </body>
</html>
